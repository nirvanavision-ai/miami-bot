[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miami-condo-monitor"
version = "1.0.0"
description = "Rental monitoring pipeline for coastal Miami luxury condos (6-12 month leases)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tenacity>=9.0",
    "scrapingbee>=2.0",
    "schedule>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "responses>=0.25", "ruff>=0.8"]

[project.scripts]
miami-bot = "main:main"

[tool.setuptools.packages.find]
include = ["miami_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:miami_bot.*"]

[tool.coverage.run]
source = ["miami_bot"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function calls in argument defaults are intentional here
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
